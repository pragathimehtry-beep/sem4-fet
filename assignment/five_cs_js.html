<!DOCTYPE html>
<html>
<head>
  <title>College Admission Form</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f0f9ff);
    }

    h2 {
      text-align: center;
      margin-top: 30px;
      color: #1f2937;
    }

    form {
      width: 420px;
      margin: 20px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 14px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: 0.3s;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 5px rgba(59,130,246,0.3);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row input {
      width: 100%;
    }

    fieldset {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      color: #374151;
      padding: 0 5px;
    }

    .inline {
      width: auto;
      margin-right: 6px;
    }

    .checkbox-row {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn {
      background: #22c55e;
      color: white;
      margin-bottom: 10px;
    }

    .submit-btn:hover {
      background: #16a34a;
    }

    .reset-btn {
      background: #ef4444;
      color: white;
    }

    .reset-btn:hover {
      background: #dc2626;
    }

    #output {
      width: 420px;
      margin: 20px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      color: #111827;
    }
  </style>

  <script>
    function saveData(event) {
      event.preventDefault();

      let fname = document.getElementById("fname").value;
      let lname = document.getElementById("lname").value;
      let dob = document.getElementById("dob").value;
      let email = document.getElementById("email").value;

      // Gender using for loop
      let gender = "Not selected";
      let genderOptions = document.getElementsByName("gender");

      for (let i = 0; i < genderOptions.length; i++) {
        if (genderOptions[i].checked) {
          gender = genderOptions[i].value;
        }
      }

      // Course Type using for loop
      let course = [];
      let courseOptions = document.getElementsByName("course");

      for (let i = 0; i < courseOptions.length; i++) {
        if (courseOptions[i].checked) {
          course.push(courseOptions[i].value);
        }
      }

      document.getElementById("output").innerHTML =
        "<h3>Submitted Details</h3>" +
        "<b>Name:</b> " + fname + " " + lname + "<br><br>" +
        "<b>DOB:</b> " + dob + "<br><br>" +
        "<b>Email:</b> " + email + "<br><br>" +
        "<b>Gender:</b> " + gender + "<br><br>" +
        "<b>Course Type:</b> " + course.join(", ");
    }

    function resetForm() {
      document.getElementById("myForm").reset();
      document.getElementById("output").innerHTML = "";
    }

    window.onload = function () {
      document.getElementById("myForm")
        .addEventListener("submit", saveData);

      document.querySelector(".reset-btn")
        .addEventListener("click", resetForm);
    };
  </script>
</head>

<body>

  <h2>College Admission Form</h2>

  <form id="myForm">

    <!-- Name -->
    <div class="row">
      <input type="text" id="fname" placeholder="First Name" required>

      <input type="text" id="lname" placeholder="Last Name" required>
    </div>

    <!-- DOB -->
    <input type="date" id="dob" required>

    <!-- Email -->
    <input type="email" id="email" placeholder="Email" required>

    <!-- Gender Fieldset -->
    <fieldset>
      <legend>Gender</legend>

      <label>
        <input type="radio" name="gender" value="Male" class="inline">
        Male
      </label>

      <label>
        <input type="radio" name="gender" value="Female" class="inline">
        Female
      </label>

      <label>
        <input type="radio" name="gender" value="Other" class="inline">
        Other
      </label>
    </fieldset>

    <!-- Course Type Fieldset -->
    <fieldset>
      <legend>Course Type</legend>

      <div class="checkbox-row">
        <label>
          <input type="checkbox" name="course" value="Full Time">
          Full Time
        </label>

        <label>
          <input type="checkbox" name="course" value="Online">
          Online
        </label>
      </div>
    </fieldset>

    <!-- Buttons -->
    <button type="submit" class="submit-btn">
      Submit
    </button>

    <button type="button" class="reset-btn">
      Reset
    </button>

  </form>

  <!-- Output -->
  <div id="output"></div>

</body>
</html>
