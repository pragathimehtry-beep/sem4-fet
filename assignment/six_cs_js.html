<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>College Admission Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Background circles */
    .circle1,
    .circle2 {
      position: absolute;
      border-radius: 50%;
      opacity: 0.4;
      z-index: 1;
    }

    .circle1 {
      width: 250px;
      height: 250px;
      background: white;
      top: 40px;
      left: 80px;
    }

    .circle2 {
      width: 300px;
      height: 300px;
      background: yellow;
      bottom: 30px;
      right: 60px;
    }

    /* Form container */
    .form-container {
      position: relative;
      z-index: 10; /* Form appears above circles */
      background: white;
      width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #007bff;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0056b3;
    }

    /* Success popup */
    .popup {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #28a745;
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 100; /* Above everything */
      display: none;
    }
  </style>
</head>
<body>

  <!-- Background Shapes -->
  <div class="circle1"></div>
  <div class="circle2"></div>

  <!-- Admission Form -->
  <div class="form-container">
    <h2>College Admission Form</h2>

    <form id="admissionForm">
      
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" required>
      </div>

      <div class="input-group">
        <label>Course</label>
        <select id="course" required>
          <option value="">Select Course</option>
          <option>BCA</option>
          <option>BBA</option>
          <option>B.Tech</option>
          <option>MBA</option>
        </select>
      </div>

      <button type="submit" class="btn">Submit Application</button>

    </form>
  </div>

  <!-- Popup Message -->
  <div class="popup" id="popup">
    Admission Form Submitted Successfully!
  </div>

  <script>
    const form = document.getElementById("admissionForm");
    const popup = document.getElementById("popup");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      popup.style.display = "block";

      setTimeout(() => {
        popup.style.display = "none";
        form.reset();
      }, 3000);
    });
  </script>

</body>
</html>
